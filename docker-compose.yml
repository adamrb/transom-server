# CPU deployment (built-in faster-whisper on CPU). For GPU transcription +
# speaker diarization, build with Dockerfile.cuda instead and give the
# container GPU access, e.g.:
#
#   services:
#     transom:
#       build: { context: ., dockerfile: Dockerfile.cuda }
#       gpus: all            # or `runtime: nvidia` with the NVIDIA runtime in
#                            # CDI mode (survives systemd daemon-reload)
#       environment:
#         - PB_STT_DEVICE=cuda
services:
  transom:
    build: .
    container_name: transom
    restart: unless-stopped
    # Bound to localhost by default — put your reverse proxy in front for
    # remote access. Change to "8090:8090" only if you understand the exposure.
    ports:
      - "127.0.0.1:8090:8090"
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    volumes:
      - ./data:/data
      # Optional: mount a notes folder and set PB_MARKDOWN_EXPORT_DIR=/notes
      # - /path/to/obsidian/vault/Plaud:/notes
